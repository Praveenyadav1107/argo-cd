apiVersion: v1
kind: ConfigMap
metadata:
  name: guestbook-ui-config
  labels:
    app: guestbook-ui
data:
  app.properties: |
    theme=light
    feature_flag=true

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
name: guestbook-ui-pvc
labels:
app: guestbook-ui
spec:
accessModes:
- ReadWriteOnce
resources:
requests:
storage: 1Gi

apiVersion: apps/v1
kind: Deployment
metadata:
name: guestbook-ui
labels:
app: guestbook-ui
spec:
replicas: 1
selector:
matchLabels:
app: guestbook-ui
template:
metadata:
labels:
app: guestbook-ui
spec:
containers:
- image: gcr.io/google-samples/gb-frontend:v5
name: guestbook-ui
ports:
- containerPort: 80
resources:
requests:
cpu: "100m"
memory: "128Mi"
limits:
cpu: "250m"
memory: "256Mi"
volumeMounts:
- name: storage-volume
mountPath: /var/lib/guestbook
- name: config-volume
mountPath: /etc/config
readOnly: true
volumes:
- name: storage-volume
persistentVolumeClaim:
claimName: guestbook-ui-pvc
- name: config-volume
configMap:
name: guestbook-ui-config

apiVersion: v1
kind: Service
metadata:
name: guestbook-ui
labels:
app: guestbook-ui
spec:
type: ClusterIP
ports:

port: 80
targetPort: 80
selector:
app: guestbook-ui

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
name: guestbook-ui-ingress
labels:
app: guestbook-ui
annotations:
nginx.ingress.kubernetes.io/rewrite-target: /
spec:
rules:

host: guestbook.example.com
http:
paths:

path: /
pathType: Prefix
backend:
service:
name: guestbook-ui
port:
number: 80

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
name: guestbook-ui-hpa
labels:
app: guestbook-ui
spec:
scaleTargetRef:
apiVersion: apps/v1
kind: Deployment
name: guestbook-ui
minReplicas: 1
maxReplicas: 5
metrics:

type: Resource
resource:
name: cpu
target:
type: Utilization
averageUtilization: 80
